<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nazeer-Mebel</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f3f3;
 color:#222;
}
header{
 background:#111;
 color:white;
 text-align:center;
 padding:28px 15px;
}
header h1{margin:0;font-size:32px}
header p{margin:10px 0 0;color:#bbb;font-size:17px}

.card{
 background:white;
 margin:20px 16px;
 padding:22px;
 border-radius:24px;
 box-shadow:0 5px 20px #00000012;
}
h2{margin-top:0;font-size:25px}

label{
 display:block;
 margin-top:16px;
 margin-bottom:7px;
 color:#666;
 font-size:16px;
}
input,select{
 width:100%;
 padding:16px;
 border:1px solid #ddd;
 border-radius:14px;
 font-size:18px;
 background:#f8f8f8;
}
button{
 width:100%;
 border:0;
 border-radius:15px;
 padding:17px;
 margin-top:18px;
 font-size:18px;
 font-weight:bold;
 background:#111;
 color:white;
}
button:active{transform:scale(.98)}

.preview{
 background:#eee;
 border-radius:18px;
 padding:30px 15px;
 text-align:center;
 overflow:hidden;
}

.cabinet{
 margin:auto;
 width:min(100%,420px);
 height:220px;
 border:12px solid #555;
 background:#fafafa;
 display:flex;
 position:relative;
 box-shadow:0 8px 15px #0002;
}
.door{
 flex:1;
 border:3px solid #aaa;
 position:relative;
 background:#f8f8f8;
}
.door:after{
 content:"";
 position:absolute;
 width:9px;
 height:65px;
 background:#c9a227;
 top:50%;
 transform:translateY(-50%);
 border-radius:3px;
}
.door:first-child:after{right:16px}
.door:last-child:after{left:16px}

.price{
 text-align:center;
 font-size:35px;
 font-weight:bold;
 margin:18px 0;
}
.info{
 background:#f5f5f5;
 padding:14px;
 border-radius:14px;
 line-height:1.7;
}
.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.menu button{
 margin:0;
 background:#eee;
 color:#222;
}
.gold{color:#b38b00}
</style>
</head>

<body>

<header>
<h1>NAZEER-MEBEL</h1>
<p>3D mebel loyihalash va hisob-kitob</p>
</header>

<div class="card">
<h2>📐 Mebel o‘lchamlari</h2>

<label>Uzunligi (mm)</label>
<input id="width" type="number" value="2200">

<label>Balandiigi (mm)</label>
<input id="height" type="number" value="800">

<label>Chuqurligi (mm)</label>
<input id="depth" type="number" value="600">

<button onclick="draw()">Mebelni chizish</button>
</div>

<div class="card">
<h2>🎨 Material va rang</h2>

<label>Fasad</label>
<select id="facade" onchange="draw()">
<option>Oq</option>
<option>Ivory</option>
<option>Light Grey</option>
<option>Wood</option>
<option>Black</option>
</select>

<label>Uslub</label>
<select id="style" onchange="draw()">
<option>Neoklassika</option>
<option>Modern</option>
<option>Minimalizm</option>
</select>

<label>Ruchka</label>
<select id="handle" onchange="draw()">
<option>Tilla</option>
<option>Qora</option>
<option>Chrome</option>
</select>
</div>

<div class="card">
<h2>🪑 Mebel ko‘rinishi</h2>

<div class="preview">
<div class="cabinet" id="cabinet">
<div class="door"></div>
<div class="door"></div>
</div>
</div>

<div class="info" id="details">
O‘lcham: 2200 × 800 × 600 mm
</div>
</div>

<div class="card">
<h2>💰 Taxminiy hisob</h2>

<div class="price" id="price">1 704 000 so‘m</div>

<button onclick="calculate()">Narxni hisoblash</button>
</div>

<div class="card">
<h2>📱 Nazeer-Mebel</h2>

<div class="menu">
<button onclick="scrollToTop()">📐 Chizma</button>
<button onclick="goMaterial()">🎨 Fasad</button>
<button onclick="goMaterial()">📦 Material</button>
<button onclick="saveProject()">💾 Saqlash</button>
</div>
</div>

<script>

function draw(){

 let w=Number(document.getElementById("width").value)||0;
 let h=Number(document.getElementById("height").value)||0;
 let d=Number(document.getElementById("depth").value)||0;

 let facade=document.getElementById("facade").value;
 let handle=document.getElementById("handle").value;

 let cabinet=document.getElementById("cabinet");
 let doors=document.querySelectorAll(".door");

 if(facade==="Oq"){
   doors.forEach(x=>x.style.background="#fafafa");
 }
 if(facade==="Ivory"){
   doors.forEach(x=>x.style.background="#f1ead7");
 }
 if(facade==="Light Grey"){
   doors.forEach(x=>x.style.background="#d8d8d8");
 }
 if(facade==="Wood"){
   doors.forEach(x=>x.style.background="#b58b5a");
 }
 if(facade==="Black"){
   doors.forEach(x=>x.style.background="#333");
 }

 let handleColor="#c9a227";
 if(handle==="Qora") handleColor="#222";
 if(handle==="Chrome") handleColor="#aaa";

 document.documentElement.style.setProperty("--handle",handleColor);

 doors.forEach(x=>{
   x.style.setProperty("--handle",handleColor);
 });

 document.getElementById("details").innerHTML=
 "O‘lcham: <b>"+w+" × "+h+" × "+d+
 " mm</b><br>Fasad: <b>"+facade+
 "</b><br>Ruchka: <b>"+handle+"</b>";

 calculate();
}

function calculate(){

 let w=Number(document.getElementById("width").value)||0;
 let h=Number(document.getElementById("height").value)||0;
 let d=Number(document.getElementById("depth").value)||0;

 if(w<=0||h<=0||d<=0){
   document.getElementById("price").innerText="0 so‘m";
   return;
 }

 let area=(w*h)/1000000;
 let base=850000;
 let material=area*550000;
 let depthAdd=d>600?100000:0;

 let total=Math.round(base+material+depthAdd);

 document.getElementById("price").innerText=
 total.toLocaleString("uz-UZ")+" so‘m";
}

function saveProject(){
 localStorage.setItem("nazeerProject",JSON.stringify({
   width:width.value,
   height:height.value,
   depth:depth.value,
   facade:facade.value,
   style:style.value,
   handle:handle.value
 }));
 alert("Loyiha saqlandi ✅");
}

function scrollToTop(){
 window.scrollTo({top:0,behavior:"smooth"});
}

function goMaterial(){
 document.querySelector(".card:nth-of-type(2)")
 .scrollIntoView({behavior:"smooth"});
}

draw();

</script>

</body>
</html>
